<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <title>Riot-game</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@1..144,1..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="principal">

        <header class="header-container">
            <img class="logo" src="Assests/riot-logo.png" alt="riot logo">
            <span>SIGN IN</span>
        </header>

        <main class="login">
            <label for="nome">Digite seu nome</label>
            <input type="text" id="nome" name="nome" placeholder="war D3N00">

            <label for="senha">Digite sua senha</label>
            <input type="text" id="senha" name="senha" placeholder="PASSEWORD">

            <div class="resgate">
                <span>Remember Me</span>
                <span>Forgot Passeword?</span>
            </div>

            <button class="sign-in">SIGN IN</button>

            <p>Don't have an account?<span class="sign">Sign Up</span></p>
            <span class="or-sign">Or Sign In With</span>

            <div>
                <button class="b1">GOOGLE</button>
                <button class="b2">Xbox</button>
            </div>

        </main>

    </div>


</body>

</html>
